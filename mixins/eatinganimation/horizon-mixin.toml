[mod]
id = "eatinganimation"
version = "0.1.0"
priority = 200

[compatibility]
horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/item_render.rs"
name = "official_eatinganimation"
source = "runtime.rs"

[[injection]]
id = "held-frame"
kind = "HEAD"
cancellable = true
target = "horizon_client::item_render::ItemRenderer::resolve"
helper = "frames.rs"
bindings = [
  { name = "renderer", ty = "&crate::item_render::ItemRenderer", value = "self" },
  { name = "stack", ty = "&horizon_assets::item_model::StackView", value = "stack" },
  { name = "display", ty = "horizon_assets::item_model::DisplayContext", value = "display" },
  { name = "owner", ty = "Option<&horizon_assets::item_model::OwnerState>", value = "owner" },
  { name = "level", ty = "Option<&horizon_assets::item_model::LevelState>", value = "level" },
  { name = "seed", ty = "i32", value = "seed" },
  { name = "env", ty = "&dyn horizon_assets::item_model::ItemEnv", value = "env" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
